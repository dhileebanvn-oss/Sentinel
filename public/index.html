<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PI Verify</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#FA5A0F"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9ECF4;--card:#fff;--tx:#1B1E2B;--mu:#8A90A2;--bd:#E6E9F2;--f1:#FA5A0F;--f2:#F0A22A;--ok:#17A168;--okb:#E4F7EE;--bad:#E5484D;--badb:#FDEBEC;--wa:#C77700;--wab:#FFF3DD;--in:#F4F5FA;--ph:#111;
--g:linear-gradient(135deg,#FA5A0F,#F0A22A);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1117;--card:#1C1F29;--tx:#F2F3F7;--mu:#9AA0B2;--bd:#2A2E3B;--in:#262A37;--okb:#12352A;--badb:#3A1D20;--wab:#3A2F14;--ph:#2A2E3B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1117;--card:#1C1F29;--tx:#F2F3F7;--mu:#9AA0B2;--bd:#2A2E3B;--in:#262A37;--okb:#12352A;--badb:#3A1D20;--wab:#3A2F14;--ph:#2A2E3B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.top{display:flex;justify-content:center;padding:14px 12px 6px}.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:0 2px 10px #0001}
.seg button{border:0;background:none;color:var(--mu);font:700 13px inherit;padding:9px 18px;border-radius:10px;cursor:pointer}.seg button.on{background:var(--g);color:#fff}
.cap{text-align:center;color:var(--mu);font-size:12px;margin:2px 12px 10px}
.phone{position:relative;margin:0 auto 24px;width:392px;max-width:100%;height:790px;max-height:calc(100vh - 110px);min-height:620px;border:10px solid var(--ph);border-radius:44px;overflow:hidden;background:var(--bg);box-shadow:0 20px 50px #0003}
.scr{height:100%;overflow-y:auto;padding:18px 16px 96px}
@media (max-width:500px){.phone{border:0;border-radius:0;width:100%;height:calc(100dvh - 104px);max-height:none;box-shadow:none;margin:0}}
h1,h2,h3,p{margin:0}.mu{color:var(--mu)}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #1b1e2b0d}
.hero{background:var(--g);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 14px 30px #fa5a0f40;position:relative;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12px inherit;padding:5px 10px;border-radius:99px;background:var(--okb);color:var(--ok)}
.hero .chip{background:#ffffff30;color:#fff}.chip.w{background:var(--wab);color:var(--wa)}.chip.b{background:var(--badb);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.big-in{display:flex;align-items:center;gap:12px;background:var(--in);border:2px solid transparent;border-radius:18px;padding:0 16px;height:66px;color:var(--mu)}
.big-in:focus-within{border-color:var(--f1);background:var(--card);box-shadow:0 0 0 4px #fa5a0f1f}
.big-in input{flex:1;min-width:0;border:0;outline:0;background:none;font:700 20px inherit;color:var(--tx);height:100%}.big-in input::placeholder{color:var(--mu);font-weight:500;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border:0;border-radius:18px;background:var(--g);color:#fff;font:800 16px inherit;cursor:pointer;box-shadow:0 10px 22px #fa5a0f38}
.btn.g{background:linear-gradient(135deg,#17A168,#35C98A);box-shadow:0 10px 22px #17a16838}.btn.o{background:var(--in);color:var(--tx);box-shadow:none}.btn.r{background:var(--badb);color:var(--bad);box-shadow:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cnt{font-size:104px;font-weight:800;line-height:1;text-align:center;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;background:#fa5a0f1a;color:var(--f1);display:grid;place-items:center;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.grid .card{margin:0;padding:14px}.grid b{font-size:26px;display:block;margin:10px 0 4px}
.bar{height:8px;background:var(--in);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px #1b1e2b14}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:700 11px inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;position:relative;cursor:pointer}
.nav button.on{color:var(--f1)}.nav button.on::before{content:"";position:absolute;top:-10px;width:44px;height:3px;border-radius:3px;background:var(--f1)}
.lg{background:var(--g);margin:-18px -16px 0;padding:54px 24px 90px;color:#fff;border-radius:0 0 36px 36px}
.logo{width:64px;height:64px;border-radius:20px;background:#fff;color:var(--f1);display:grid;place-items:center;margin-bottom:20px;box-shadow:0 10px 24px #0002}
.lc{margin:-56px 4px 0;position:relative;padding:22px 18px}
.sq{width:46px;height:46px;flex:none;border:0;border-radius:15px;background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px #1b1e2b14}.sbar{animation:ex .25s ease-out;transform-origin:right}@keyframes ex{from{opacity:0;transform:scaleX(.3)}to{opacity:1;transform:none}}button:disabled{opacity:.5;cursor:default}th,td{padding:5px 8px;text-align:left}th{color:var(--mu);font-weight:600}.tst{position:absolute;left:14px;right:14px;top:14px;z-index:9;padding:14px 16px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 10px 30px #0004;animation:ex .25s ease-out;color:#fff}.tst.ok{background:#17A168}.tst.bad{background:#E5484D}.fc{border:0;cursor:pointer;padding:8px 14px;border-radius:99px;font:700 13px inherit;background:var(--card);color:var(--mu);white-space:nowrap;flex:none}.fc.on{background:var(--g);color:#fff}.pick{display:flex;gap:14px;align-items:center;cursor:pointer}.lbl{font:700 12px inherit;color:var(--mu);margin:0 0 8px 4px;display:block}
.toast{background:var(--wab);color:var(--wa);border-radius:14px;padding:11px 14px;font-weight:600;font-size:13px;margin-bottom:12px}
.drop{border:2px dashed #fa5a0f66;border-radius:20px;padding:26px 16px;text-align:center;background:#fa5a0f0d;color:var(--f1);font-weight:700}
.wk{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:8;background:#1B1E2B;color:#fff;padding:8px 16px;border-radius:99px;font:700 13px inherit;opacity:.92}.phone{width:100%;max-width:560px;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;margin:0 auto;box-shadow:none}.top{display:none}</style></head><body>

<div class="phone"><div class="scr" id="scr"></div><div class="nav" id="bn"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',chk:'<path d="M5 12l5 5 9-10"/>',warn:'<path d="M12 3l10 18H2zM12 10v5M12 18h.01"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M17 4.5a3.5 3.5 0 0 1 0 7M22 20a6 6 0 0 0-4-5.6"/>',pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',clip:'<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5a3 3 0 0 1 6 0M9 12h6M9 16h4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',out:'<path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
let U={};
let NM={},SITES=[];const RL={master:'Master admin',site:'Site admin',counter:'Counter'};
let ME=null,T='',F='ALL',AT='perp',CB=null,Q={open:false,v:''},msg='',C;const rc=()=>C={mode:null,loc:null,cur:null,n:0,msg:'',done:[],bl:[]};rc();
let LOCS={},LP={},LB={},D=[],B=[];
const stP=l=>LP[l]||'Pending',stB=l=>LB[l]||'Pending';
const my=()=>U[ME],adm=()=>my().r!='counter',site=l=>LOCS[l],vis=s=>my().r=='master'?(F=='ALL'||F==s):s==my().s;
const fn=l=>l.r.length?l.r[l.r.length-1]:0,mt=l=>l.r.length&&fn(l)==l.sys,f1=l=>l.r[0]==l.sys;
const chip=(t,c='')=>`<span class="chip ${c}">${t}</span>`,nm=id=>id?NM[id]+' ('+id+')':'',cc=s=>s=='Closed'?'':s=='Pending'?'b':'w',sub=t=>`<h3 style="margin:6px 4px 10px;font-size:15px">${t}</h3>`;
const res=l=>{if(!l.r.length)return['Not counted','b'];if(f1(l))return['1st count',''];const i=l.r.indexOf(l.sys);if(i>0)return['After recount R'+(i+1),'w'];return[l.req?'R'+(l.r.length+1)+' requested':'Not matched (R'+l.r.length+')','b']};
const rch=l=>chip(...res(l)),cls=()=>D.filter(l=>vis(site(l.loc))&&stP(l.loc)=='Closed');
const nav=(items,on,f)=>items.map(([k,l,i])=>`<button class="${k==on?'on':''}" onclick="${f}('${k}')">${ic(i)}<span>${l}</span></button>`).join('');
const row=(a,b,r)=>`<div class="item" style="padding:9px 0"><div style="flex:1"><b>${a}</b><div class="mu" style="font-size:11px">${b}</div></div>${r}</div>`;
const fc=()=>my().r!='master'?'':`<div class="row" style="margin-bottom:12px;overflow-x:auto">${['ALL',...SITES].map(s=>`<button class="fc ${F==s?'on':''}" onclick="F='${s}';draw()">${s=='ALL'?'All sites':'Site '+s}</button>`).join('')}</div>`;
const at=()=>`<div class='big-in' style='height:50px;margin-bottom:12px;border-radius:14px'>${ic('list',20)}<select onchange='AT=this.value;draw()' style='flex:1;border:0;background:none;font:700 15px inherit;color:var(--tx)'><option value='perp' ${AT=='perp'?'selected':''}>Perpetual audit</option><option value='bin' ${AT=='bin'?'selected':''}>Bin-face audit</option></select></div>`,
capn=(n,m)=>n>m?`<p class='mu' style='font-size:12px;text-align:center;margin-bottom:10px'>Showing first ${m} of ${n}. Use search, or download the CSV for everything.</p>`:'',
csvBox=()=>`<div class='card'><h3>${esc(CB.n)}</h3><p class='mu' style='font-size:12px;margin:4px 0 8px'>Direct download is not available in this view. Copy the CSV below.</p><textarea readonly style='width:100%;height:160px;font:12px monospace;background:var(--in);color:var(--tx);border:0;border-radius:12px;padding:10px'>${esc(CB.d)}</textarea><button class='btn o' style='margin-top:10px' onclick='CB=null;draw()'>Close</button></div>`;
async function dl(n,rows){const d=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');try{const m=window.claude&&await window.claude.use('downloads');if(m){await m.save({filename:n,data:d});return}}catch(e){if(e&&e.code=='declined')return}CB={n,d};draw()}
function dlx(k){const cl=cls(),g=d=>[d.r[0]??'',d.r[1]??'',d.r[2]??''];
if(AT=='perp'){const L=k=='rec'?cl.filter(l=>!mt(l)):cl;return dl(k=='rec'?'reconciliation_perpetual.csv':'final_pi_report_perpetual.csv',[['Site','Location','Part','Lot size','System','R1','R2','R3','Final count','Variance','Count result','First scan','Last scan','Duration (min)','Counter']].concat(L.map(d=>[site(d.loc),d.loc,d.part,d.lot||1,d.sys,...g(d),fn(d),fn(d)-d.sys,res(d)[0],iso(d.t1),iso(d.t2),du(d.t1,d.t2),nm(d.by)])))}
const L=B.filter(b=>vis(site(b.loc))&&(k=='rep'||!b.ok));return dl(k=='rec'?'reconciliation_binface.csv':'final_pi_report_binface.csv',[['Site','Location','Part','Result','System location','Scan time','Counter']].concat(L.map(b=>[site(b.loc),b.loc,b.part,b.ok?'OK':'Wrong location',b.sl||'',iso(b.t),nm(b.by)])))}
var SN={},SM='';
const sitesCard=()=>`<div class='card'><h3 style='margin-bottom:10px'>Sites</h3><div class='row' style='margin:0 0 10px'><div class='big-in' style='height:54px'><input id='sc' placeholder='Site code e.g. 4700' inputmode='numeric' style='font-size:16px'></div><div class='big-in' style='height:54px'><input id='sn' placeholder='Site name (optional)' style='font-size:16px'></div></div>${SM?`<div class='toast'>${SM}</div>`:''}<button class='btn' onclick='addSite()'>Add site</button>${sd('sites','Sites list',SITES.length,`<div style='margin-top:10px'>${SITES.map(s=>row('Site '+s,(SN[s]||'No name')+' · '+Object.keys(LOCS).filter(l=>site(l)==s).length+' locations · '+Object.values(U).filter(u=>u.s==s).length+' users',chip('Active'))).join('')}</div>`)}</div>`;
function addSite(){const c=$('#sc').value.trim();if(!/^\d{3,6}$/.test(c)||SITES.includes(c)){SM='Enter a new site code of 3 to 6 digits that does not exist yet.';return draw()}SITES.push(c);SN[c]=$('#sn').value.trim();SM='Site '+c+' added. Now upload its stock dump and create its site admin.';draw()}
const bulk=op=>{const e=op.filter(d=>!d.req&&d.r.length<3),en=op.filter(d=>d.req).length;return `<div class='card'><b>${op.length} parts to reconcile</b><p class='mu' style='font-size:12px;margin:4px 0 12px'>${en?en+' already enabled for recount. ':''}One tap enables recount for every open discrepancy${my().r=='master'&&F=='ALL'?' in all sites':''}.</p><button class='btn' ${e.length?'':'disabled'} onclick='recAll()'>${e.length?'Enable recount for all '+e.length+' parts':'Recount enabled for all'}</button></div>`};
function recAll(){cls().filter(l=>!mt(l)&&!l.req&&l.r.length<3).forEach(l=>l.req=1);draw()}
function demoAll(){D.forEach(l=>{if(l.req){l.r.push(l.sys);l.req=0}});draw()}
const DET={};
const sd=(k,t,n,h)=>`<div class='row sp' style='margin:6px 4px 10px'><h3 style='font-size:15px'>${t} <span class='mu' style='font-weight:600'>(${n})</span></h3><button class='fc' onclick='DET["${k}"]=!DET["${k}"];draw()'>${DET[k]?'Hide details ▴':'See details ▾'}</button></div>${DET[k]?h:''}`;
function hdr(){if(Q.open)return `<div class="row" style="margin-bottom:16px"><div class="big-in sbar" style="height:54px;flex:1;border-radius:16px">${ic('search')}<input id="q" value="${esc(Q.v)}" placeholder="Paste or enter location / part no" oninput="Q.v=this.value;drawRes()" style="font-size:16px" autocomplete="off"></div><button class="sq" onclick="paste()">${ic('clip')}</button><button class="sq" onclick="sq(0)">${ic('x')}</button></div>`;
return `<div class="row sp" style="margin-bottom:16px"><div><p class="mu" style="font-size:13px">Welcome back</p><h2 style="font-size:20px">${my().n} 👋</h2></div><div class="row"><span class="chip"><i class="dot"></i>${my().s=='ALL'?'All sites':'Site '+my().s}</span><button class="sq" onclick="sq(1)">${ic('search')}</button></div></div>`}
function sq(o){Q.open=!!o;if(!o)Q.v='';draw()}
function paste(){const f=t=>{Q.v=t.trim();$('#q').value=Q.v;drawRes()};try{navigator.clipboard.readText().then(f).catch(()=>{$('#q').placeholder='Long-press here to paste';$('#q').focus()})}catch(e){$('#q').focus()}}
function tab(k){T=k;Q={open:false,v:''};draw()}
function mine(){const m={};D.filter(l=>l.by==ME&&l.r.length).forEach(l=>(m[l.loc]=m[l.loc]||[]).push([l.part,fn(l)]));
if(C.mode=='perp'&&C.loc){const a=(m[C.loc]||[]).filter(x=>!C.done.some(d=>d[0]==x[0]));C.done.forEach(d=>a.push(d));if(C.cur)a.push([C.cur,C.n]);if(a.length)m[C.loc]=a}return m}
function mineB(){const m={};B.filter(b=>b.by==ME).forEach(b=>(m[b.loc]=m[b.loc]||[]).push(b.part));if(C.mode=='bin'&&C.loc&&C.bl.length)m[C.loc]=(m[C.loc]||[]).concat(C.bl);return m}
function results(){const q=Q.v.trim().toUpperCase();if(!q)return '';const A=adm(),m=mine(),mb=mineB();
const ls=Object.keys(LOCS).filter(l=>vis(site(l))&&l.includes(q)),ps=[...new Set(D.map(d=>d.part).concat(B.map(b=>b.part)))].filter(p=>p.includes(q));
const pr=(d,k)=>row(k=='p'?d.part:d.loc,`System ${d.sys} · Counts ${d.r.join(' → ')||'–'}${d.by?' · '+nm(d.by):''}`,rch(d)),br=(b,k)=>row(k=='p'?b.part:b.loc,b.ok?'In correct location':'Wrong location · system: '+(b.sl||'unknown'),b.ok?chip('✔ OK'):chip('✖ Wrong','b'));let h='';
ls.forEach(l=>{h+=`<div class="card"><div class="row sp"><b>📍 ${l}</b>${chip('Site '+site(l),'w')}</div><div class="row" style="margin:8px 0;flex-wrap:wrap">${chip('Perpetual: '+stP(l),cc(stP(l)))}${chip('Bin-face: '+stB(l),cc(stB(l)))}</div>`;
if(A)h+=D.filter(d=>d.loc==l).map(d=>pr(d,'p')).join('')+B.filter(b=>b.loc==l).map(b=>br(b,'p')).join('');
else h+=(m[l]||[]).map(x=>row(x[0],'Your perpetual count '+x[1],chip(x[1]))).join('')+(mb[l]||[]).map(p=>row(p,'Bin-face scanned',chip('Scanned'))).join('')||'<p class="mu" style="font-size:13px">No scans by you here yet.</p>';h+='</div>'});
ps.forEach(p=>{h+=`<div class="card"><b>🔎 ${p}</b><div style="margin-top:6px">`;
if(A)h+=D.filter(d=>d.part==p&&vis(site(d.loc))).map(d=>pr(d,'l')).join('')+B.filter(b=>b.part==p&&vis(site(b.loc))).map(b=>br(b,'l')).join('');
else h+=Object.keys(m).flatMap(l=>m[l].filter(x=>x[0]==p).map(x=>row(l,'Your perpetual count '+x[1],chip(x[1])))).join('')+Object.keys(mb).filter(l=>mb[l].includes(p)).map(l=>row(l,'Bin-face scanned',chip('Scanned'))).join('')||'<p class="mu" style="font-size:13px">You have not scanned this part yet.</p>';h+='</div></div>'});
return h||`<div class="card"><p class="mu">No match found for “${esc(q)}” in ${A&&my().r=='master'&&F=='ALL'?'any site':'your site'}.</p></div>`}
function login(){return `<div class="lg"><div class="logo">${ic('box',34)}</div><h1 style="font-size:34px;font-weight:800;line-height:1.15">PI Verify<br>Login</h1><p style="opacity:.85;margin-top:8px;font-weight:500">Physical inventory verification</p></div>
<div class="card lc"><label class="lbl">User ID</label><div class="big-in" style="margin-bottom:16px">${ic('user')}<input id="lu" placeholder="Enter your user ID" autocomplete="off"></div><label class="lbl">PIN</label><div class="big-in" style="margin-bottom:20px">${ic('lock')}<input id="lp" type="password" placeholder="Enter your PIN" onkeydown="if(event.key=='Enter')doLogin()"></div>${msg?`<div class="toast">${msg}</div>`:''}

if(!C.cur&&C.done.some(d=>d[0]==v)){C.msg=v+' is already counted in this location. Ask your admin to enable a recount.';return draw()}
if(C.cur&&C.cur!=v){C.msg='Finish '+C.cur+' first: tap Completed, then scan the next part.';return draw()}C.cur=v;C.n+=(LOT[v]||1);C.msg='';qd('scan',{loc:C.loc,part:v,q:1});draw()}
function bpart(v){v=(v||'').trim().toUpperCase();if(!v)return;if(C.bl.includes(v))C.msg=v+' is already scanned in this location.';else{C.bl.push(v);C.msg='';qd('bscan',{loc:C.loc,part:v})}draw()}
function wr(){const l=LOT[C.cur]||1;if(C.n>=l){C.n-=l;qd('scan',{loc:C.loc,part:C.cur,q:-1})}draw()}
function fin(){C.done.unshift([C.cur,C.n]);qd('done',{loc:C.loc,part:C.cur});C.cur=null;C.n=0;draw()}
function pauseLoc(){qd('pause',{loc:C.loc,audit:C.mode});C.loc=null;C.cur=null;C.bl=[];C.done=[];draw()}
function close_(){if(C.cur){C.msg='Tap Completed for '+C.cur+' before closing the location.';return draw()}qd('close',{loc:C.loc,audit:'perp'});LP[C.loc]='Closed';C.msg='Location '+C.loc+' closed. ✔';C.loc=null;C.done=[];draw();flush().then(()=>load(1))}
function closeB(){qd('close',{loc:C.loc,audit:'bin'});LB[C.loc]='Closed';C.msg='Location '+C.loc+' closed. ✔';C.loc=null;C.bl=[];draw();flush().then(()=>load(1))}
async function act(p,b,m){if(act.b)return false;act.b=1;try{await api(p,b);await load();if(m)toast(m);return true}catch(e){toast(e.message,false);return false}finally{act.b=0}}
function addSite(){const c=$('#sc').value.trim();act('/api/site',{code:c,name:$('#sn').value},'Site '+c+' created successfully.')}
function addU(){const id=$('#ni').value.trim().toUpperCase();act('/api/users',{id,name:$('#nn').value,pin:$('#np').value,role:$('#nr').value,site:my().r=='master'?$('#ns').value:my().s},'User '+id+' created.')}
function resetPin(id){const p=prompt('New PIN for '+id+' (min 4 characters):');if(p)act('/api/users/pin',{id,pin:p},'PIN updated for '+id+'.')}
function delUser(id){if(confirm('Delete user '+id+'? Their past scans stay in the log.'))act('/api/users/delete',{id},'User '+id+' deleted.')}
async function myPin(){const o=prompt('Current PIN:');if(!o)return;const p=prompt('New PIN (min 4 characters):');if(!p)return;try{await api('/api/mypin',{old:o,pin:p});toast('PIN changed.')}catch(e){toast(e.message,false)}}
async function sendStock(){const s=upS(),n=UP.ok;if(await act('/api/stock',{site:s,csv:UP.csv,name:UP.name},'Stock uploaded: '+n+' lines for site '+s+'.')){UP=null;draw()}}
function doReset(k){const s=upS();act('/api/reset',{site:s,kind:k},k=='scan'?'Scanning data reset for site '+s+'.':'Stock and scans removed for site '+s+'.')}
async function recAll(){const e=cls().filter(l=>!mt(l)&&!l.req&&l.r.length<3);if(!e.length)return;const m=my().r=='master';if(!confirm('Enable recount for all '+e.length+' open discrepancies'+(m?(F=='ALL'?' in all sites':' in site '+F):'')+'? Counters will then be able to recount them.'))return;act('/api/recount-all',{site:m?F:my().s},'Recount enabled for all open discrepancies.')}
async function tpl(k){const rows=[['Location','Part','Qty','Lot size'],['A-01-01','BOLT-M8',120,10],['A-01-01','NUT-M8',300,50],['A-01-02','SEAL-25',75,'']];if(k=='csv')return dl('stock_template.csv',rows);try{await loadX();const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Stock');XLSX.writeFile(wb,'stock_template.xlsx')}catch(e){toast(e.message,false)}}
function dlScan(){location.href='/api/export/scans?t='+TOK}
async function dl(n,rows){const d=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+d],{type:'text/csv'}));a.download=n;a.click()}
async function logout(){if(C.loc)pauseLoc();await flush();if(Qu.length&&!confirm(Qu.length+' scans are not synced yet and will be lost if you logout now. Logout anyway?'))return;Qu=[];localStorage.q='[]';TOK='';localStorage.removeItem('t');ME=null;if(ES){ES.close();ES=null}draw()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
if(TOK){load();flush()}else draw();

const SC={t:0,n:0,tm:0};
function scanGo(f){clearTimeout(SC.tm);const el=$('#in');if(!el)return;const v=el.value.replace(/[\r\n\t]/g,'').trim();if(!v)return;({loc:loc,part:scanPart,bpart:bpart,find:cfindGo})[f](v)}
function sk(e,f){if(e.key=='Enter'||e.keyCode==13||e.key=='Tab'){e.preventDefault();scanGo(f)}}
function sa(el,f,e){const now=Date.now(),gap=now-SC.t;SC.t=now;SC.n=gap<80?SC.n+1:1;clearTimeout(SC.tm);
if(e&&(e.inputType=='insertLineBreak'||e.inputType=='insertFromPaste')||/[\r\n\t]/.test(el.value)){SC.tm=setTimeout(()=>scanGo(f),50);return}
if(SC.n>=4&&el.value.trim().length>=4)SC.tm=setTimeout(()=>scanGo(f),200)}

let CF={q:'',r:null,e:''};
function cfind(){const r=CF.r,w=['This location still needs this part','Not counted yet','Already looks complete'];let out='';
if(CF.e)out=`<div class="toast" style="margin-top:14px">${esc(CF.e)}</div>`;
else if(r&&r.res.length){const t=r.res[0];out=`<div class="hero" style="margin:14px 0 10px;padding:16px"><p style="opacity:.9;font-weight:600">Put ${esc(r.q)} in</p><h1 style="font-size:34px;margin:2px 0 8px">${esc(t.loc)}</h1>${chip(w[t.rank])}</div>${r.res.length>1?`<p class="mu" style="font-size:12px;margin:0 0 4px">Other system locations for this part</p>`+r.res.slice(1).map(x=>row(esc(x.loc),w[x.rank],chip(x.rank==0?'Needs part':x.rank==1?'Not counted':'Complete',x.rank==0?'w':x.rank==1?'b':''))).join(''):''}${r.more?`<p class="mu" style="font-size:12px;margin-top:6px">+${r.more} more locations</p>`:''}`}
else if(r){out=`<div class="toast" style="margin-top:14px;background:var(--badb);color:var(--bad)">✖ ${esc(r.q)} has no system location at your site.</div>`+(r.sg.length?`<p class="mu" style="font-size:12px;margin-bottom:6px">Did you mean</p><div class="row" style="flex-wrap:wrap">${r.sg.map(p=>`<button class="fc" data-p="${esc(p)}" onclick="cfindGo(this.dataset.p)">${esc(p)}</button>`).join('')}</div>`:'')}
return `<div class="card"><div class="row sp" style="margin-bottom:10px"><b>Find correct location</b>${chip('Scan a part','w')}</div><div class="big-in">${ic('scan',26)}<input id="in" value="" placeholder="Scan or enter part no" autocomplete="off" onkeydown="sk(event,'find')" oninput="sa(this,'find',event)"></div><button class="btn" style="margin-top:10px;height:50px" onclick="scanGo('find')">Find location</button>${out}</div><p class="mu" style="font-size:12px;text-align:center">Shows where the part belongs in the system. Quantities stay hidden. Needs a connection.</p>`}
async function cfindGo(v){v=(v||'').trim().toUpperCase();if(!v)return;CF.q=v;CF.e='';try{CF.r=await api('/api/findpart?q='+encodeURIComponent(v))}catch(e){CF.r=null;CF.e=e.message||'Needs a connection.'}draw()}
</script></body></html>
