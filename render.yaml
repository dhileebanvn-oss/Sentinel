# Render Blueprint – creates the web service and a Postgres database together.
services:
  - type: web
    name: sentinel
    runtime: node
    plan: starter            # change if you prefer another plan
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_KEY          # needed once, to create the Super Admin
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
databases:
  - name: sentinel-db
    plan: basic-256mb        # change if you prefer another plan
